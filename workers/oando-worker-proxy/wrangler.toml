name = "oando-worker-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = false

[[routes]]
pattern = "oando.co.in/*"
zone_name = "oando.co.in"

[[routes]]
pattern = "www.oando.co.in/*"
zone_name = "oando.co.in"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# R2 bucket binding
[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "oando-asset-cdn"

# Environment variables
[vars]
VERCEL_ORIGIN = "https://23082026.vercel.app"
# Comma-separated hosts that must NOT inherit Vercel preview noindex.
# (Worker rewrites Host to *.vercel.app for origin routing.)
PUBLIC_INDEXABLE_HOSTS = "oando.co.in,www.oando.co.in"

# Vectorize index for catalog semantic search (AI advisor RAG)
# Create with: npx wrangler vectorize create catalog-nav --dimensions 768 --metric cosine
[[vectorize]]
binding = "CATALOG_VECTORS"
index_name = "catalog-nav"
